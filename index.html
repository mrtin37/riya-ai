<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#070b14">
<title>Riya — Personal AI</title>
<style>
:root{--bg:#050812;--panel:#0b1220;--line:#1b2940;--text:#eef5ff;--muted:#8fa2bb;--accent:#62d8ff;--accent2:#8a7dff}
*{box-sizing:border-box} body{margin:0;background:radial-gradient(circle at 50% 5%,#13233d 0,#070b14 38%,#03050a 100%);color:var(--text);font-family:system-ui,-apple-system,Segoe UI,sans-serif;min-height:100vh}
.app{max-width:700px;margin:auto;height:100vh;display:flex;flex-direction:column}
header{padding:calc(18px + env(safe-area-inset-top)) 18px 14px;display:flex;align-items:center;justify-content:space-between;border-bottom:1px solid #142035;background:#050812cc;backdrop-filter:blur(14px)}
.brand{display:flex;gap:12px;align-items:center}.orb{width:42px;height:42px;border-radius:50%;background:radial-gradient(circle at 35% 30%,#fff,#62d8ff 20%,#5a6cff 55%,#111936 75%);box-shadow:0 0 25px #62d8ff88}.name{font-size:20px;font-weight:800;letter-spacing:2px}.status{font-size:11px;color:var(--muted)}.online{color:#65e6ae}
main{flex:1;overflow:auto;padding:20px 16px 12px}.welcome{text-align:center;margin:30px 0 24px}.welcome h1{font-size:34px;margin:0 0 8px}.welcome p{color:var(--muted);margin:0}.suggestions{display:flex;gap:8px;overflow:auto;padding-bottom:8px}.chip{white-space:nowrap;border:1px solid var(--line);background:#0b1322;color:#bcd0e8;border-radius:20px;padding:9px 13px;font-size:13px}
.message{display:flex;margin:12px 0}.message.user{justify-content:flex-end}.bubble{max-width:82%;padding:12px 15px;border-radius:18px;line-height:1.45;font-size:15px}.riya .bubble{background:#0d1727;border:1px solid #1a2b43;border-bottom-left-radius:5px}.user .bubble{background:linear-gradient(135deg,#286b91,#4850a8);border-bottom-right-radius:5px}
footer{padding:10px 12px calc(12px + env(safe-area-inset-bottom));border-top:1px solid #142035;background:#050812ee;backdrop-filter:blur(14px)}.composer{display:flex;gap:8px;align-items:center;background:#0b1220;border:1px solid #1b2940;border-radius:28px;padding:6px}.composer input{flex:1;background:transparent;border:0;outline:0;color:white;font-size:15px;padding:11px 7px;min-width:0}.btn{width:43px;height:43px;border-radius:50%;border:1px solid #273953;background:#101b2c;color:#dcecff;font-size:18px}.send{background:linear-gradient(135deg,#3e8cae,#5b56b6);border:0}.mic.active{box-shadow:0 0 0 5px #62d8ff22,0 0 24px #62d8ff88;background:#17394a}.hint{text-align:center;color:#64758c;font-size:10px;margin-top:7px}
</style>
</head>
<body>
<div class="app">
<header>
  <div class="brand"><div class="orb" id="orb"></div><div><div class="name">RIYA</div><div class="status"><span class="online">● ONLINE</span> · Personal AI Assistant</div></div></div>
  <button class="btn" onclick="clearChat()" title="Clear chat">⌫</button>
</header>

<main id="chat">
  <div class="welcome">
    <h1>Good to see you.</h1>
    <p>I'm Riya. Talk to me or type a message.</p>
  </div>
  <div class="suggestions">
    <button class="chip" onclick="usePrompt('What can you do?')">What can you do?</button>
    <button class="chip" onclick="usePrompt('Give me a morning briefing')">Morning briefing</button>
    <button class="chip" onclick="usePrompt('Tell me something interesting')">Surprise me</button>
  </div>
  <div id="messages"></div>
</main>

<footer>
  <div class="composer">
    <button class="btn mic" id="mic" onclick="toggleMic()">🎙</button>
    <input id="input" autocomplete="off" placeholder="Talk to Riya..." onkeydown="if(event.key==='Enter')send()">
    <button class="btn send" onclick="send()">➤</button>
  </div>
  <div class="hint" id="hint">Voice recognition works best in Chrome on Android.</div>
</footer>
</div>

<script>
const messagesEl=document.getElementById('messages'), input=document.getElementById('input'), mic=document.getElementById('mic'), hint=document.getElementById('hint');
let recognition=null, listening=false;
const saved=JSON.parse(localStorage.getItem('riya_messages')||'[]');
saved.forEach(m=>render(m.text,m.user,false));
if(!saved.length) reply("Hello! I'm Riya. I'm ready. Ask me anything.");

function render(text,user=true,save=true){
 const row=document.createElement('div'); row.className='message '+(user?'user':'riya');
 const bubble=document.createElement('div'); bubble.className='bubble'; bubble.textContent=text;
 row.appendChild(bubble); messagesEl.appendChild(row);
 document.getElementById('chat').scrollTop=document.getElementById('chat').scrollHeight;
 if(save){saved.push({text,user});localStorage.setItem('riya_messages',JSON.stringify(saved.slice(-100)));}
}
function usePrompt(t){input.value=t;send()}
function send(){
 const t=input.value.trim(); if(!t)return;
 render(t,true); input.value='';
 // Demo brain. Replace this function with your AI API call when ready.
 setTimeout(()=>reply(localBrain(t)),350);
}
function reply(t){render(t,false);speak(t)}
function localBrain(t){
 const q=t.toLowerCase();
 if(q.includes('your name')) return "My name is Riya. I'm your personal AI assistant.";
 if(q.includes('what can you do')) return "Right now I'm your phone-first Riya interface. I can listen, speak, remember this chat on your device, and respond to basic requests. My real AI brain can be connected next.";
 if(q.includes('morning briefing')) return "Good morning. Your Riya briefing module is ready to be connected to live weather, news, calendar and reminders.";
 if(q.includes('interesting')) return "Fun fact: honey never spoils under normal storage conditions. Archaeologists have found ancient honey that remained edible.";
 if(q.includes('hello')||q.includes('hi')) return "Hello! What would you like me to do?";
 if(q.includes('time')) return "The current time on your phone is "+new Date().toLocaleTimeString([], {hour:'numeric',minute:'2-digit'})+".";
 return "I heard you. My next upgrade is to connect me to a real AI model so I can answer this properly.";
}
function speak(text){
 if('speechSynthesis' in window){speechSynthesis.cancel(); const u=new SpeechSynthesisUtterance(text);u.rate=.95;u.pitch=1.0;speechSynthesis.speak(u);}
}
function toggleMic(){
 const SR=window.SpeechRecognition||window.webkitSpeechRecognition;
 if(!SR){hint.textContent='Speech recognition is not supported here. Try Chrome on Android.';return}
 if(listening){recognition.stop();return}
 recognition=new SR(); recognition.lang=navigator.language||'en-IN'; recognition.interimResults=false; recognition.maxAlternatives=1;
 recognition.onstart=()=>{listening=true;mic.classList.add('active');hint.textContent='Listening… speak now';};
 recognition.onresult=e=>{input.value=e.results[0][0].transcript;send()};
 recognition.onerror=()=>{hint.textContent='I could not hear that. Tap the microphone and try again.'};
 recognition.onend=()=>{listening=false;mic.classList.remove('active');if(hint.textContent==='Listening… speak now')hint.textContent='Voice recognition works best in Chrome on Android.'};
 recognition.start();
}
function clearChat(){localStorage.removeItem('riya_messages');messagesEl.innerHTML='';reply("Chat cleared. I'm ready for you.");}
</script>
</body>
</html>
