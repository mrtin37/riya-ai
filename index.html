<!DOCTYPE html>
<html lang="hi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Riya</title>
<style>
  *{box-sizing:border-box}
  body{margin:0;background:#0b0b12;color:#fff;font-family:sans-serif;
       display:flex;flex-direction:column;height:100vh;height:100dvh}
  header{padding:14px;text-align:center;font-weight:bold;background:#15151f}
  #chat{flex:1;overflow-y:auto;padding:12px}
  .msg{max-width:85%;padding:10px 14px;margin:8px 0;border-radius:16px;
       line-height:1.4;white-space:pre-wrap}
  .user{background:#3b5bdb;margin-left:auto}
  .riya{background:#23232f}
  #bar{display:flex;gap:6px;padding:10px;background:#15151f}
  #text{flex:1;padding:12px;border-radius:20px;border:none;
        background:#23232f;color:#fff;font-size:16px}
  button{border:none;border-radius:50%;width:44px;height:44px;
         font-size:20px;background:#3b5bdb;color:#fff}
</style>
</head>
<body>
<header>Riya 🤖</header>
<div id="chat"></div>
<div id="bar">
  <button id="mic">🎤</button>
  <input id="text" placeholder="Riya se baat karo...">
  <button id="send">➤</button>
</div>

<script>
const WORKER_URL = "riya-ai.akshaygada4v.workers.devv";

const chat = document.getElementById("chat");
const text = document.getElementById("text");

// Memory: purani baatein phone mein save rehti hain
let history = [];
try { history = JSON.parse(localStorage.getItem("riya_history")) || []; } catch (e) {}

function addMsg(role, content) {
  const d = document.createElement("div");
  d.className = "msg " + (role === "user" ? "user" : "riya");
  d.textContent = content;
  chat.appendChild(d);
  chat.scrollTop = chat.scrollHeight;
  return d;
}

history.forEach(m => addMsg(m.role, m.content));
if (!history.length) addMsg("assistant", "Hi! Main Riya hoon. Kya haal hai?");

function speak(t) {
  if (!window.speechSynthesis) return;
  speechSynthesis.cancel();
  const u = new SpeechSynthesisUtterance(t);
  u.lang = "hi-IN";
  speechSynthesis.speak(u);
}

async function sendMessage() {
  const q = text.value.trim();
  if (!q) return;
  text.value = "";
  addMsg("user", q);
  history.push({ role: "user", content: q });
  const thinking = addMsg("assistant", "...");

  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ messages: history.slice(-20) })
    });
    const data = await res.json();
    const reply = data.reply || "Kuch gadbad ho gayi, dobara try karo.";
    thinking.textContent = reply;
    history.push({ role: "assistant", content: reply });
    localStorage.setItem("riya_history", JSON.stringify(history.slice(-40)));
    speak(reply);
  } catch (e) {
    thinking.textContent = "Network error: " + e.message;
  }
}

// Voice input
const SR = window.SpeechRecognition || window.webkitSpeechRecognition;
document.getElementById("mic").onclick = () => {
  if (!SR) { alert("Voice input ke liye Chrome use karo."); return; }
  const r = new SR();
  r.lang = "hi-IN";
  r.onresult = e => { text.value = e.results[0][0].transcript; sendMessage(); };
  r.start();
};

document.getElementById("send").onclick = sendMessage;
text.addEventListener("keydown", e => { if (e.key === "Enter") sendMessage(); });
</script>
</body>
</html>
